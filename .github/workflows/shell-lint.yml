name: Shell Lint
on:
  pull_request:
    paths:
      - 'etc/**/*.sh'
jobs:
  shfmt:
    name: shfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install shfmt
        uses: taiki-e/install-action@v2
        with:
          tool: shfmt
      - name: Run shfmt
        run: |
          shopt -s globstar
          shfmt -i 4 -ci -d etc/**/*.sh
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install shellcheck
        uses: taiki-e/install-action@v2
        with:
          tool: shellcheck
      - name: Run shellcheck
        run: |
          shopt -s globstar
          shellcheck etc/**/*.sh
