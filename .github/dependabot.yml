version: 2
updates:
  - package-ecosystem: cargo
    directory: '/'
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    labels: []
    commit-message:
      prefix: 'build'
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: daily
    labels: []
    commit-message:
      prefix: 'ci'
