[graph]
all-features = true

[advisories]
yanked = "deny"

[bans]
multiple-versions = "deny"
wildcards = "deny"
skip = [{ name = "syn", version = "2.0.119", reason = "Waiting for the ecosystem to fully migrate to syn v3. It's a build-time dependency, so having two versions is harmless." }]

[licenses]
allow = ["MIT", "Apache-2.0", "MPL-2.0", "Unicode-3.0", "ISC", "BSD-3-Clause"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
