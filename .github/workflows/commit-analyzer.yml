name: Commit Analyzer
on:
  pull_request:
    types: [opened, edited, synchronize]
jobs:
  commitlint:
    runs-on: ubuntu-latest
    name: commitlint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set nodejs
        uses: actions/setup-node@v4
        with:
          registry-url: https://registry.npmjs.org/
          node-version: lts/*
      - name: Install commitlint dependencies
        run: npm i @commitlint/config-conventional@latest
      - name: Validate PR title with commitlint
        env:
          # `github.event.pull_request.title` is potentially untrusted.
          # NOTE: https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#example-of-a-script-injection-attack
          TITLE: ${{ github.event.pull_request.title }}
        run: echo "$TITLE" | npx commitlint@latest
      - name: Validate PR commits with commitlint
        run: npx commitlint@latest -f ${{ github.event.pull_request.base.sha }} -t ${{ github.event.pull_request.head.sha }} -V
