name: Report a workflow issue
description: Add or improve workflow.
title: 'wf: '
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping us update our workflow!
        
        > [!NOTE]
        > Before submitting, please carefully read the [CONTRIBUTING.md](https://github.com/kurosakishigure/katharsis/blob/canary/.github/CONTRIBUTING.md).
  - type: textarea
    id: workflow_description
    attributes:
      label: Workflow Description
      description: The specific details of the workflow.
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Rationale
      description: What problem does this workflow solve?
    validations:
      required: true
  - type: textarea
    id: additional_information
    attributes:
      label: Additional Information
      description: What additional information do you need to provide?
    validations:
      required: false
