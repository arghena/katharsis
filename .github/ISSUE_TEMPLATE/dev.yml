name: Report a dev kit issue
description: Add or improve dev kit.
title: 'dev: '
body:
  - type: markdown
    attributes:
      value: Thank you for helping us update our dev kit!
  - type: textarea
    id: dev_kit_description
    attributes:
      label: Dev Kit Description
      description: The specific details of the dev kit.
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Rationale
      description: What problem does this dev kit solve?
    validations:
      required: true
  - type: textarea
    id: additional_information
    attributes:
      label: Additional Information
      description: What additional information do you need to provide?
    validations:
      required: false
