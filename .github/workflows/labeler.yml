name: PR Labeler
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
on:
  - pull_request_target
jobs:
  labeler:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    name: Add PR labels
    if: github.repository_owner == 'arghena'
    steps:
      - name: Run labeler
        uses: actions/labeler@v5
