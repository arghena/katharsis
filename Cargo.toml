[package]
name = "katharsis"
authors = ["Shigure Kurosaki <shigure@hqsy.net>"]
version = "1.0.0-canary.21"
edition = "2021"
license = "MIT"
categories = ["command-line-utilities"]
repository = "https://github.com/kurosakishigure/katharsis"
description = "CLI tool for generating RSS feeds."
include = ["/src/", "/LICENSE"]

[lints.clippy]
pedantic = "warn"

[[bin]]
name = "katharsis"

[dependencies]
anyhow = "1.0.95"
chrono = "0.4.39"
clap = { version = "4.5.23", features = ["derive", "env"] }
glob = "0.3.2"
inquire = "0.7.5"
rss = "2.0.11"
scraper = "0.22.0"
serde = { version = "1.0.217", features = ["derive"] }
thiserror = "2.0.9"
tokio = { version = "1.42.0", features = ["fs", "io-util", "macros", "rt-multi-thread"] }
toml = "0.8.19"
url = { version = "2.5.4", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4.4"
tempfile = "3.14.0"
