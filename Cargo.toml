[package]
name = "katharsis"
authors = ["Shigure Kurosaki <shigure@hqsy.net>"]
version = "1.0.0-canary.30"
edition = "2024"
rust-version = "1.85.0"
license = "MIT"
categories = ["command-line-utilities"]
keywords = ["cli", "feed", "generator", "rss", "tool"]
repository = "https://github.com/arghena/katharsis"
homepage = "https://github.com/arghena/katharsis"
documentation = "https://docs.rs/katharsis"
description = "CLI tool for generating RSS feeds."
include = ["/LICENSE", "/src/"]

[[bin]]
name = "katharsis"

[dependencies]
anyhow = "1.0.99"
chrono = "0.4.41"
clap = { version = "4.5.47", features = ["derive", "env"] }
glob = "0.3.3"
inquire = "0.9.1"
rss = "2.0.12"
scraper = "0.24.0"
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.16"
tokio = { version = "1.48.0", features = [
  "fs",
  "io-util",
  "macros",
  "rt-multi-thread",
] }
toml = "0.9.5"
url = { version = "2.5.7", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4.4"

[lints.clippy]
pedantic = "warn"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tarpaulin_include)"] }

[profile.release]
strip = true
lto = true
panic = "abort"
codegen-units = 1
