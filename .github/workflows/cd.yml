name: CD

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-canary.[0-9]+']

permissions:
  contents: read

jobs:
  build-dist:
    name: Building for ${{ matrix.job.os }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      matrix:
        job:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            use-cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            use-cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use-cross: false
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            use-cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use-cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use-cross: true
          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
            use-cross: true
          - os: ubuntu-latest
            target: arm-unknown-linux-gnueabihf
            use-cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use-cross: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup override set stable
      - name: Install cross
        if: ${{ matrix.job.use-cross }}
        uses: taiki-e/install-action@305bebabd4457bed9b82541755f034994382465b # v2.68.10
        with:
          tool: cross
      - name: Cargo build
        shell: bash
        run: |
          if [[ "${{ matrix.job.use-cross }}" == "true" ]]; then
            cross build --release --locked --target ${{ matrix.job.target }}
          else
            cargo build --release --locked --target ${{ matrix.job.target }}
          fi
      - name: Install binutils for ARM32
        if: ${{ matrix.job.target == 'arm-unknown-linux-gnueabihf' }}
        run: |
          sudo apt update
          sudo apt install -y binutils-arm-linux-gnueabihf
      - name: Install binutils for ARM64
        if: ${{ matrix.job.target == 'aarch64-unknown-linux-gnu' }}
        run: |
          sudo apt update
          sudo apt install -y binutils-aarch64-linux-gnu
      - name: Packaging final binary
        shell: bash
        env:
          PROJECT_NAME: katharsis
          TARGET: ${{ matrix.job.target }}
        run: ./etc/ci/before_deploy.sh
      - name: Uploading distribution
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dist
          path: |
            katharsis-*-${{ matrix.job.target }}.*
            katharsis*.deb

  create-attestation:
    permissions:
      id-token: write
      attestations: write
    needs: build-dist
    runs-on: ubuntu-latest
    name: Create attestation
    steps:
      - name: Downloading distribution
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist
      - name: Generate attestation
        uses: actions/attest-build-provenance@e4d4f7c39adfa4c260fb5c147f0622000aa14b99 # v4.0.0
        with:
          subject-path: dist/katharsis*

  create-release-note:
    permissions:
      contents: write
    needs: build-dist
    runs-on: ubuntu-latest
    name: Create release note
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Downloading distribution
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist
      - name: Generate release note
        # NOTE: The recommended workflow for publishing an immutable release
        # will be to initially create the release as a draft,
        # attach any associated assets, and then publish the draft.
        # https://github.com/orgs/community/discussions/171210#discussioncomment-14237940
        run: |
          if [[ $GITHUB_REF_NAME = *canary* ]]; then
            npx changelogithub@latest --prerelease --draft
          else
            npx changelogithub@latest --draft
          fi

          gh release upload "$GITHUB_REF_NAME" -- dist/katharsis*
          gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-to-cargo:
    permissions:
      id-token: write
      contents: read
    name: Publishing to Cargo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@b7e9a28eded4986ec6b1fa40eeee8f8f165559ec # v1.0.3
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup override set stable
      - name: Cargo publish
        run: cargo publish --locked
        env:
          CARGO_INCREMENTAL: 0
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-to-winget:
    name: Publish to WinGet
    runs-on: ubuntu-latest
    # NOTE: The action will only work when the release is published (not a draft),
    # because the release assets (binaries) aren't available publicly until the release is published.
    # https://github.com/vedantmgoyal9/winget-releaser/blob/main/README.md#getting-started-
    needs: create-release-note
    steps:
      - uses: vedantmgoyal2009/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: arghena.katharsis
          installers-regex: '-pc-windows-msvc\.zip$'
          # NOTE: New fine-grained PATs aren't supported by the action.
          # https://github.com/vedantmgoyal9/winget-releaser/issues/172
          token: ${{ secrets.BOT_TOKEN }}
