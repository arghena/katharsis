name: Report an issue
description: Report a Katharsis issue.
type: Problem
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill out this bug report!
  - type: input
    attributes:
      label: Katharsis Version
      description: What is the version number of your Katharsis?
      placeholder: for example, 1.0.0
    validations:
      required: true
  - type: input
    attributes:
      label: System Version
      description: What is your system version?
      placeholder: for example, macOS 15.1.1
    validations:
      required: true
  - type: input
    attributes:
      label: Link to Minimal Reproduction Code for This Issue
      description: Please make sure to test on the latest canary version.
      placeholder: https://github.com/user/my-minimal-katharsis-issue-reproduction
    validations:
      required: true
  - type: textarea
    attributes:
      label: To Reproduce
      description: A step-by-step description of how to reproduce the issue.
      value: '1. REPRODUCTION_STEP'
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected Behavior
      description: What were you expecting to happen?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual Behavior
      description: What actually happened instead?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional Information
      description: What additional information do you need to provide?
    validations:
      required: false
