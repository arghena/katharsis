name: CI
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-canary.[0-9]+']
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/nextjs/.next/server/app/articles/*.html'
      - '.config/ast-grep/**/*.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.rustfmt.toml'
      - 'sgconfig.yml'
      - '.editorconfig'
jobs:
  unit_tests:
    name: Unit tests
    runs-on: ${{ matrix.job.os }}
    strategy:
      matrix:
        job:
          - os: macos-latest
            target: aarch64-apple-darwin
            use-cross: false
          - os: macos-latest
            target: x86_64-apple-darwin
            use-cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use-cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use-cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use-cross: true
          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
            use-cross: true
          - os: ubuntu-latest
            target: arm-unknown-linux-gnueabihf
            use-cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use-cross: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}
      - name: Install cross
        if: matrix.job.use-cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Unit tests
        shell: bash
        run: |
          if [[ "${{ matrix.job.use-cross }}" == "true" ]]; then
            cross test --release --locked -v --target ${{ matrix.job.target }} -- --nocapture
          else
            cargo test --release --locked -v --target ${{ matrix.job.target }} -- --nocapture
          fi
  integration_tests:
    name: Integration tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build for release
        run: cargo build --release --locked -v --target ${{ matrix.target }}
      - name: End to end tests
        run: |
          cargo run --release --locked -v --target ${{ matrix.target }} init -- < /dev/null
          cargo run --release --locked -v --target ${{ matrix.target }} -- < /dev/null
  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check -v
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy Check
        run: cargo clippy --all-targets --locked -v -- -D warnings
  msrv:
    runs-on: ubuntu-latest
    name: Minimum Supported Rust Version
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Installing Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-msrv
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-msrv
      - name: Run cargo-msrv
        run: cargo msrv verify --log-level debug
  sg-lint:
    runs-on: ubuntu-latest
    name: Run ast-grep lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: ast-grep lint
        uses: ast-grep/action@v1.5.0
        with:
          paths: src tests
  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin
      - name: Run cargo-tarpaulin
        # WARNING: `--engine llvm` causes the test coverage to be inaccurate.
        run: cargo tarpaulin --release --locked -v --engine ptrace --out lcov --output-dir target/tarpaulin -- --nocapture
      - name: Upload to Coveralls
        if: ${{ github.event_name == 'push' }}
        uses: coverallsapp/github-action@v2
        with:
          file: './target/tarpaulin/lcov.info'
