name: Propose an improvement
description: New feature or request.
title: 'feat: '
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing to Katharsis, please go ahead and describe your proposal!
        
        > [!NOTE]
        > Before submitting, please carefully read the [CONTRIBUTING.md](https://github.com/kurosakishigure/katharsis/blob/canary/.github/CONTRIBUTING.md).
  - type: textarea
    id: feature_description
    attributes:
      label: Feature Description
      description: The specific details of the feature.
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Rationale
      description: What problem does this feature solve?
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Approach
      description: How do we implement it?
    validations:
      required: false
