name: CD

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-canary.[0-9]+']

jobs:
  build-dist:
    name: Building for ${{ matrix.job.os }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      matrix:
        job:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            use-cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            use-cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use-cross: false
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            use-cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use-cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use-cross: true
          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
            use-cross: true
          - os: ubuntu-latest
            target: arm-unknown-linux-gnueabihf
            use-cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use-cross: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Installing Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}
      - name: Install cross
        if: matrix.job.use-cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Cargo build
        shell: bash
        run: |
          if [[ "${{ matrix.job.use-cross }}" == "true" ]]; then
            cross build --release --locked --target ${{ matrix.job.target }}
          else
            cargo build --release --locked --target ${{ matrix.job.target }}
          fi
      - name: Install required dependencies
        shell: bash
        run: |
          if [[ ${{ matrix.job.target }} == arm-unknown-linux-gnueabihf ]]; then
              sudo apt update
              sudo apt-get install -y binutils-arm-linux-gnueabihf
          fi
          if [[ ${{ matrix.job.target }} == aarch64-unknown-linux-gnu ]]; then
              sudo apt update
              sudo apt-get install -y binutils-aarch64-linux-gnu
          fi
      - name: Packaging final binary
        shell: bash
        env:
          PROJECT_NAME: katharsis
          TARGET: ${{ matrix.job.target }}
        run: ./etc/ci/before_deploy.sh
      - name: Uploading distribution
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: |
            katharsis-*-${{ matrix.job.target }}.*
            katharsis*.deb

  create-attestation:
    permissions:
      id-token: write
      attestations: write
    needs: build-dist
    runs-on: ubuntu-latest
    name: Create attestation
    steps:
      - name: Downloading distribution
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
      - name: Generate attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/katharsis*

  create-release-note:
    permissions:
      contents: write
    needs: build-dist
    runs-on: ubuntu-latest
    name: Create release note
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Downloading distribution
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
      - name: Generate release note
        # NOTE:
        # The recommended workflow for publishing an immutable release
        # will be to initially create the release as a draft,
        # attach any associated assets, and then publish the draft.
        # https://github.com/orgs/community/discussions/171210#discussioncomment-14237940
        run: |
          if [[ $GITHUB_REF_NAME = *canary* ]]; then
            npx changelogithub@latest --prerelease --draft
          else
            npx changelogithub@latest --draft
          fi

          gh release upload "$GITHUB_REF_NAME" -- dist/katharsis*
          gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-to-cargo:
    name: Publishing to Cargo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Installing Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo publish
        run: cargo publish --locked --token ${{ secrets.CARGO_API_KEY }}

  publish-to-winget:
    name: Publish to WinGet
    runs-on: ubuntu-latest
    # NOTE:
    # The action will only work when the release is published (not a draft),
    # because the release assets (binaries) aren't available publicly until the release is published.
    # https://github.com/vedantmgoyal9/winget-releaser?tab=readme-ov-file#getting-started-
    needs: create-release-note
    steps:
      - uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: arghena.katharsis
          installers-regex: '-pc-windows-msvc\.zip$'
          token: ${{ secrets.BOT_TOKEN }}
