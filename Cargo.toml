[package]
name = "katharsis"
version = "1.0.0-canary.30"
edition = "2024"
rust-version = "1.88.0"
description = "CLI tool for generating RSS feeds."
repository = "https://github.com/arghena/katharsis"
license = "MIT"
keywords = ["cli", "feed", "generator", "rss", "tool"]
categories = ["command-line-utilities"]
include = ["/LICENSE", "/src/"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }{ archive-suffix }"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.'cfg(target_os = "windows")']
pkg-fmt = "zip"

[lib]
bench = false

[[bin]]
bench = false
name = "katharsis"

[[bench]]
harness = false
name = "feed"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive", "env"] }
glob = "0.3.4"
inquire = "0.9.5"
jiff = "1.0.0"
rss = { version = "2.1.2", default-features = false }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "macros", "rt-multi-thread"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
divan = "0.1.21"
tempfile = "3.27.0"
tokio-test = "0.4.6"

[lints.clippy]
pedantic = "warn"

[lints.rust]
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage,coverage_nightly)"] }

[profile.release]
strip = true
lto = true
panic = "abort"
codegen-units = 1
