name: Shell Analyzer
on:
  pull_request:
    paths:
      - 'etc/ci/*.sh'
      - '.editorconfig'
jobs:
  shfmt:
    name: shfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install shfmt
        uses: taiki-e/install-action@v2
        with:
          tool: shfmt
      - name: Run shfmt
        run: |
          shopt -s globstar
          shfmt -i 4 -ci -d -f etc/ci/*.sh
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install shellcheck
        uses: taiki-e/install-action@v2
        with:
          tool: shellcheck
      - name: Run shellcheck
        run: |
          shopt -s globstar
          shellcheck etc/ci/*.sh
