name: CD

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-canary.[0-9]+']

permissions:
  contents: read

jobs:
  build-dist:
    name: Build for ${{ matrix.job.os }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      matrix:
        job:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            use-cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            use-cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use-cross: false
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            use-cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use-cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use-cross: true
          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
            use-cross: true
          - os: ubuntu-latest
            target: arm-unknown-linux-gnueabihf
            use-cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use-cross: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup override set stable
      - name: Install cross
        if: ${{ matrix.job.use-cross }}
        uses: taiki-e/install-action@5faf876256ccfc7ba64a4f87314c3457cc374b98 # v2.68.22
        with:
          tool: cross
      - name: Cargo build
        shell: bash
        run: |
          if [[ "${{ matrix.job.use-cross }}" == "true" ]]; then
            cross build --release --locked --target ${{ matrix.job.target }}
          else
            cargo build --release --locked --target ${{ matrix.job.target }}
          fi
      - name: Install binutils for ARM32
        if: ${{ matrix.job.target == 'arm-unknown-linux-gnueabihf' }}
        run: |
          sudo apt update
          sudo apt install -y binutils-arm-linux-gnueabihf
      - name: Install binutils for ARM64
        if: ${{ matrix.job.target == 'aarch64-unknown-linux-gnu' }}
        run: |
          sudo apt update
          sudo apt install -y binutils-aarch64-linux-gnu
      - name: Package final binary
        shell: bash
        env:
          PROJECT_NAME: katharsis
          TARGET: ${{ matrix.job.target }}
        run: ./etc/ci/before_deploy.sh
      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: dist-${{ matrix.job.target }}
          path: |
            katharsis-*-${{ matrix.job.target }}.*
            katharsis*.deb

  create-attestation:
    permissions:
      id-token: write
      attestations: write
      # artifact-metadata: write
      # https://github.com/actions/attest/blob/main/README.md#container-image
    needs: build-dist
    runs-on: ubuntu-latest
    name: Create attestation
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Generate attestation
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: dist/katharsis*

  create-release-note:
    permissions:
      contents: write
    needs: build-dist
    runs-on: ubuntu-latest
    name: Create release note
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Enable pnpm
        run: corepack enable pnpm
      - name: Download artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Generate release note
        # NOTE: The recommended workflow for publishing an immutable release
        # will be to initially create the release as a draft,
        # attach any associated assets, and then publish the draft.
        # https://github.com/orgs/community/discussions/171210#discussioncomment-14237940
        run: |
          if [[ $GITHUB_REF_NAME == *canary* ]]; then
            pnpm dlx changelogithub --prerelease --draft
          else
            pnpm dlx changelogithub --draft
          fi

          gh release upload "$GITHUB_REF_NAME" -- dist/katharsis*
          gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-to-crates-io:
    permissions:
      id-token: write
      contents: read
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup override set stable
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@b7e9a28eded4986ec6b1fa40eeee8f8f165559ec # v1.0.3
      - name: Cargo publish
        run: cargo publish --locked
        env:
          CARGO_INCREMENTAL: 0
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-to-winget:
    name: Publish to WinGet
    runs-on: ubuntu-latest
    # NOTE: The action will only work when the release is published (not a draft),
    # because the release assets (binaries) aren't available publicly until the release is published.
    # https://github.com/vedantmgoyal9/winget-releaser/blob/main/README.md#getting-started-
    needs: create-release-note
    steps:
      - uses: vedantmgoyal2009/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: arghena.katharsis
          installers-regex: '-pc-windows-msvc\.zip$'
          # NOTE: New fine-grained PATs aren't supported by the action.
          # https://github.com/vedantmgoyal9/winget-releaser/issues/172
          token: ${{ secrets.BOT_TOKEN }}
