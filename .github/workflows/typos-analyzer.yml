name: Typos Analyzer
on:
  pull_request:
    paths:
      - 'etc/**'
      - 'src/**'
      - 'tests/**'
      - '.typos.toml'
jobs:
  typos:
    runs-on: ubuntu-latest
    name: typos
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install typos
        uses: taiki-e/install-action@v2
        with:
          tool: typos
      - name: Run typos
        run: typos
