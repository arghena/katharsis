[package]
name = "katharsis"
authors = ["Shigure Kurosaki <shigure@hqsy.net>"]
version = "1.0.0-canary.29"
edition = "2024"
rust-version = "1.85.0"
license = "MIT"
categories = ["command-line-utilities"]
keywords = ["rss", "feed", "generator", "cli", "tool"]
repository = "https://github.com/arghena/katharsis"
homepage = "https://github.com/arghena/katharsis"
documentation = "https://docs.rs/katharsis"
description = "CLI tool for generating RSS feeds."
include = ["/src/", "/LICENSE"]

[lints.clippy]
pedantic = "warn"

[[bin]]
name = "katharsis"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tarpaulin_include)"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
anyhow = "1.0.97"
chrono = "0.4.40"
clap = { version = "4.5.34", features = ["derive", "env"] }
glob = "0.3.2"
inquire = "0.7.5"
rss = "2.0.12"
scraper = "0.23.1"
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.12"
tokio = { version = "1.44.1", features = [
  "fs",
  "io-util",
  "macros",
  "rt-multi-thread",
] }
toml = "0.8.20"
url = { version = "2.5.4", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4.4"
