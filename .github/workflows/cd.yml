name: CD

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-canary.[0-9]+']

jobs:
  create-release-note:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    name: Create release note
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set nodejs
        uses: actions/setup-node@v4
        with:
          registry-url: https://registry.npmjs.org/
          node-version: lts/*
      - name: Generate release note
        run: |
          if ${{ contains(github.ref_name, 'canary') }}; then
            npx changelogithub@latest --prerelease
          else
            npx changelogithub@latest
          fi
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

  publish-assets:
    permissions:
      contents: write
    needs: create-release-note
    name: Publishing for ${{ matrix.job.os }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      matrix:
        job:
          - os: macos-latest
            target: x86_64-apple-darwin
            use-cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            use-cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use-cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use-cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use-cross: true
          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
            use-cross: true
          - os: ubuntu-latest
            target: arm-unknown-linux-gnueabihf
            use-cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use-cross: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Installing Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}
      - name: Install cross
        if: matrix.job.use-cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Cargo build
        shell: bash
        run: |
          if [[ "${{ matrix.job.use-cross }}" == "true" ]]; then
            cross build --release --locked -v --target ${{ matrix.job.target }}
          else
            cargo build --release --locked -v --target ${{ matrix.job.target }}
          fi
      - name: Install required dependencies
        shell: bash
        run: |
          if [[ ${{ matrix.job.target }} == arm-unknown-linux-gnueabihf ]]; then
              sudo apt update
              sudo apt-get install -y binutils-arm-linux-gnueabihf
          fi
          if [[ ${{ matrix.job.target }} == aarch64-unknown-linux-gnu ]]; then
              sudo apt update
              sudo apt-get install -y binutils-aarch64-linux-gnu
          fi
      - name: Packaging final binary
        shell: bash
        env:
          TARGET: ${{ matrix.job.target }}
          PROJECT_NAME: katharsis
          OS_NAME: ${{ matrix.job.os }}
        run: ./etc/ci/before_deploy.sh
      - name: Releasing assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            katharsis-*-${{ matrix.job.target }}.*
            katharsis*.deb

  publish-to-cargo:
    name: Publishing to Cargo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Installing Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cargo publish
        run: cargo publish --locked -v --token ${{ secrets.CARGO_API_KEY }}

  publish-to-winget:
    name: Publish to WinGet
    runs-on: ubuntu-latest
    needs: publish-assets
    steps:
      - uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: arghena.katharsis
          installers-regex: '-pc-windows-msvc\.zip$'
          token: ${{ secrets.BOT_TOKEN }}
