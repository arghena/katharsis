name: Audit

on:
  schedule:
    # Runs every Monday.
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  insight:
    name: Insight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Insight
        uses: arghena/insight@62d488f37413b5fd1a6e7113a345056a55143865 # v0.1.0-canary.58
