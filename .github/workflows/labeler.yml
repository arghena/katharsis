name: Labeler
on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
jobs:
  issue-labeler:
    permissions:
      issues: write
    if: ${{ github.event_name == 'issues' }}
    runs-on: ubuntu-latest
    name: Add issue labels
    strategy:
      matrix:
        label:
          - { prefix: 'fix:', name: 'bug' }
          - { prefix: 'docs:', name: 'documentation' }
          - { prefix: 'feat:', name: 'enhancement' }
          - { prefix: 'ex:', name: 'example' }
          - { prefix: 'test:', name: 'test' }
          - { prefix: 'wf:', name: 'workflow' }
          - { prefix: 'dev:', name: 'dev' }
    steps:
      - name: Add ${{ matrix.label.name }} label
        uses: actions-ecosystem/action-add-labels@v1
        if: ${{ startsWith(github.event.issue.title, matrix.label.prefix) }}
        with:
          labels: ${{ matrix.label.name }}
  pr-labeler:
    permissions:
      pull-requests: write
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    name: Add PR labels
    strategy:
      matrix:
        label:
          - { prefix: 'fix:', name: 'bug' }
          - { prefix: 'chore:', name: 'chore' }
          - { prefix: 'docs:', name: 'documentation' }
          - { prefix: 'feat:', name: 'enhancement' }
          - { prefix: 'ex:', name: 'example' }
          - { prefix: 'revert:', name: 'revert' }
          - { prefix: 'test:', name: 'test' }
          - { prefix: 'dep:', name: 'dependency' }
          - { prefix: 'act:', name: 'action' }
          - { prefix: 'wf:', name: 'workflow' }
          - { prefix: 'dev:', name: 'dev' }
    steps:
      - name: Add ${{ matrix.label.name }} label
        uses: actions-ecosystem/action-add-labels@v1
        if: ${{ startsWith(github.event.pull_request.title, matrix.label.prefix) }}
        with:
          labels: ${{ matrix.label.name }}
