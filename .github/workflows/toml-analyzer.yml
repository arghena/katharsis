name: TOML Analyzer
on:
  pull_request:
    paths:
      - 'examples/**/*.toml'
      - 'src/**/*.toml'
      - 'tests/**/*.toml'
      - '.prettierrc.toml'
      - 'Cargo.toml'
      - 'deny.toml'
      - 'rust-toolchain.toml'
      - '.rustfmt.toml'
      - '.editorconfig'
jobs:
  taplo:
    name: taplo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install taplo
        run: |
          curl -fsSL https://github.com/tamasfe/taplo/releases/latest/download/taplo-full-linux-x86_64.gz \
            | gzip -d - | install -m 755 /dev/stdin /usr/local/bin/taplo
      - name: Run taplo fmt
        run: |
          shopt -s globstar
          taplo fmt examples/**/*.toml src/**/*.toml tests/**/*.toml .prettierrc.toml Cargo.toml deny.toml rust-toolchain.toml .rustfmt.toml --check
      - name: Run taplo check
        run: |
          shopt -s globstar
          taplo check examples/**/*.toml src/**/*.toml tests/**/*.toml .prettierrc.toml Cargo.toml deny.toml rust-toolchain.toml .rustfmt.toml
